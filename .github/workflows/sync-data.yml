name: Sync card data & prices
on:
  schedule:
    - cron: '17 11 * * *' # daily, 11:17 UTC
  workflow_dispatch:
permissions:
  contents: write
jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/sync-data.mjs
      - name: Commit if changed
        run: |
          if git diff --quiet -- src/data api/_cards.ts; then echo "No changes"; exit 0; fi
          git config user.name "vault-bot"
          git config user.email "vault-bot@users.noreply.github.com"
          git add src/data api/_cards.ts
          git commit -m "chore(data): daily card + price sync"
          git push
